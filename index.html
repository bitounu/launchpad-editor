<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launchpad Mini MK3 – Pixel Art Editor</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --border: #0f3460;
    --text: #e0e0e0;
    --accent: #e94560;
    --hover: #533483;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 16px;
    letter-spacing: 1px;
    color: #fff;
  }
  .app {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    flex-wrap: wrap;
  }
  .toolbar .separator {
    width: 1px;
    background: var(--border);
    margin: 4px 4px;
  }
  .toolbar button {
    width: 44px; height: 44px;
    border: 2px solid transparent;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    position: relative;
  }
  .toolbar button:hover { background: var(--hover); }
  .toolbar button.active { border-color: var(--accent); background: var(--hover); }
  .toolbar button .tooltip {
    display: none;
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    white-space: nowrap;
    z-index: 10;
  }
  .toolbar button:hover .tooltip { display: block; }
  .toolbar button svg {
    width: 24px;
    height: 24px;
  }

  /* Grid */
  .grid-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 56px);
    grid-template-rows: repeat(8, 56px);
    gap: 3px;
  }
  .cell {
    width: 56px; height: 56px;
    border-radius: 6px;
    cursor: crosshair;
    border: 2px solid transparent;
    transition: border-color .1s;
    position: relative;
  }
  .cell:hover { border-color: rgba(255,255,255,0.4); }
  .cell.selected {
    border-color: var(--accent) !important;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .cell .idx-label {
    position: absolute;
    bottom: 2px; right: 4px;
    font-size: 9px;
    color: rgba(255,255,255,0.6);
    text-shadow: 0 0 2px #000;
    pointer-events: none;
  }

  /* Palette */
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .palette-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .palette-section h3 {
    font-size: 0.85rem;
    margin-bottom: 8px;
    color: #aaa;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 30px);
    gap: 2px;
  }
  .palette .swatch {
    width: 30px; height: 30px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .1s;
    position: relative;
  }
  .palette .swatch:hover { transform: scale(1.2); z-index: 2; }
  .palette .swatch.active { border-color: #fff; transform: scale(1.15); z-index: 2; }
  .swatch .swatch-tip {
    display: none;
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.65rem;
    white-space: nowrap;
    z-index: 20;
  }
  .swatch:hover .swatch-tip { display: block; }

  /* Current color preview */
  .current-color {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .current-color .preview {
    width: 40px; height: 40px;
    border-radius: 6px;
    border: 2px solid #555;
  }
  .current-color .info {
    font-size: 0.85rem;
    line-height: 1.4;
  }

  /* Actions */
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actions button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    transition: background .15s;
  }
  .actions button:hover { background: var(--hover); }

  /* Checkerboard for color 0 (off/transparent) */
  .cell-off {
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    background-color: #1e1e1e;
  }

  /* Confirm dialog */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    min-width: 320px;
    text-align: center;
  }
  .modal p {
    margin-bottom: 20px;
    font-size: 1rem;
  }
  .modal .modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .modal button {
    padding: 8px 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background .15s;
  }
  .modal .btn-confirm {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .modal .btn-confirm:hover { background: #c73a52; }
  .modal .btn-cancel {
    background: var(--bg);
    color: var(--text);
  }
  .modal .btn-cancel:hover { background: var(--hover); }
  #liveBtn.active {
    background: #2ecc40;
    color: #000;
    border-color: #2ecc40;
    font-weight: bold;
  }
  #liveBtn.error {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
</style>
</head>
<body>

<h1>Launchpad Mini MK3 &mdash; Pixel Art Editor</h1>

<div class="app">
  <div class="left-panel">
    <div class="toolbar" id="toolbar"></div>
    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>
    <div class="actions">
      <button onclick="saveFile()">&#128190; Zapisz plik</button>
      <button onclick="loadFile()">&#128194; Wczytaj plik</button>
      <button id="liveBtn" onclick="toggleLive()">&#127927; Live Preview</button>
      <input type="file" id="fileInput" accept=".txt,.lp" style="display:none" onchange="handleFileLoad(event)">
    </div>
  </div>

  <div class="right-panel">
    <div class="current-color">
      <div class="preview" id="currentPreview"></div>
      <div class="info" id="currentInfo">Kolor: 0<br>#000000</div>
    </div>
    <div class="palette-section">
      <h3>Paleta kolorów (0–127)</h3>
      <div class="palette" id="palette"></div>
    </div>
  </div>
</div>

<!-- Confirm dialog for new document -->
<div class="modal-overlay" id="newDocModal">
  <div class="modal">
    <p>Czy na pewno chcesz rozpocząć nowy obrazek?<br>Obecna praca zostanie utracona.</p>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeNewDocModal()">Anuluj</button>
      <button class="btn-confirm" onclick="confirmNewDoc()">Tak, nowy obrazek</button>
    </div>
  </div>
</div>

<script>
// Launchpad Mini MK3 palette – 128 colors (index -> hex)
const PALETTE = [
  "#000000","#505050","#a0a0a0","#f0f0f0","#ff9185","#ff230a","#e61f09","#cc1c08",
  "#ffc285","#ff850a","#e67709","#cc6a08","#fff385","#ffe70a","#e6cf09","#ccb808",
  "#daff85","#b6ff0a","#a3e609","#91cc08","#a9ff85","#54ff0a","#4be609","#43cc08",
  "#85ff91","#0aff23","#09e61f","#08cc1c","#85ffc2","#0aff85","#09e677","#08cc6a",
  "#85fff3","#0affe7","#09e6cf","#08ccb8","#85daff","#0ab6ff","#09a3e6","#0891cc",
  "#85a9ff","#0a54ff","#094be6","#0843cc","#9185ff","#230aff","#1f09e6","#1c08cc",
  "#c285ff","#850aff","#7709e6","#6a08cc","#f385ff","#e70aff","#cf09e6","#b808cc",
  "#ff85da","#ff0ab6","#e609a3","#cc0891","#f04115","#bf6100","#b18c00","#859708",
  "#50a027","#009d8e","#0079c0","#0000ff","#2d50a4","#6247b0","#7b7b7b","#3c3c3c",
  "#ff0000","#bfbb64","#a6c000","#78c823","#34c500","#00c0af","#00a2f1","#527de7",
  "#8868e7","#a447af","#b93b69","#975731","#f86c00","#befd00","#82ff5d","#00ff00",
  "#00ffa5","#52ffe8","#00e9ff","#89c4ff","#91a5ff","#b989ff","#da67e7","#ff2cd6",
  "#ffa601","#fff200","#e3f600","#dcc500","#bf9e5f","#88b57b","#86c2ba","#9ab3c5",
  "#84a5c3","#c78b7a","#f43c7f","#ff93a5","#ffa36f","#ffef9a","#d2e594","#bad16f",
  "#a9a9a9","#d3fee0","#ccf1f9","#b9c0e4","#cdbae5","#d0d0d0","#dfe6e5","#ffffff",
  "#f2210a","#bf1a08","#acf20a","#88bf08","#f2db0a","#bfad08","#f7a409","#e06b41"
];

// --- SVG Icons ---
const SVG_ICONS = {
  brush: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.37 2.63a2.12 2.12 0 013 3L14 13l-4 1 1-4z"/>
    <path d="M9 15c-3 1-5 3-5 5 2 0 4-1 5-3"/>
  </svg>`,

  selectRect: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 2"/>
  </svg>`,

  selectEllipse: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="12" cy="12" rx="9" ry="7" stroke-dasharray="3 2"/>
  </svg>`,

  selectVLine: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 2" opacity="0.3"/>
    <rect x="9" y="3" width="6" height="18" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-dasharray="3 2"/>
  </svg>`,

  selectHLine: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 2" opacity="0.3"/>
    <rect x="3" y="9" width="18" height="6" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-dasharray="3 2"/>
  </svg>`,

  bucket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 16V4h8l4 4v8a2 2 0 01-2 2H7a2 2 0 01-2-2z" fill="currentColor" opacity="0.15"/>
    <path d="M19 11c1 1 2 2 2 3.5S20 17 19 17s-2-1.5-2-2.5 1-2.5 2-3.5"/>
    <path d="M2 21l5-5"/>
    <path d="M7 16l6.5-6.5"/>
    <path d="M12.5 4L17 8.5"/>
  </svg>`,

  eraser: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 20H7L3 16l10-10 8 8-4 4"/>
    <path d="M7 16l6-6"/>
  </svg>`,

  clearSel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M8 6V4h8v2M19 6v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
    <line x1="10" y1="11" x2="10" y2="17"/>
    <line x1="14" y1="11" x2="14" y2="17"/>
  </svg>`,

  newDoc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="12" x2="12" y2="18"/>
    <line x1="9" y1="15" x2="15" y2="15"/>
  </svg>`,

  deselect: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 2"/>
    <line x1="8" y1="8" x2="16" y2="16" stroke-width="2"/>
    <line x1="16" y1="8" x2="8" y2="16" stroke-width="2"/>
  </svg>`,

  picker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 3l-1.5 1.5M12 12l6.5-6.5"/>
    <path d="M18.5 5.5l-1-1"/>
    <path d="M14 10l-8.5 8.5a1.5 1.5 0 000 2.12v0a1.5 1.5 0 002.12 0L16 12"/>
    <path d="M3.5 20.5l1.5-1.5"/>
  </svg>`,
};

// State
const grid = new Array(64).fill(0);
let currentColor = 5;
let currentTool = 'brush';
let selection = new Set();
let isMouseDown = false;
let selStartCell = null;
let dragState = null;

// Selection sub-modes: 'rect', 'ellipse', 'vline', 'hline'
const selectModes = ['rect', 'ellipse', 'vline', 'hline'];
const selectModeIcons = {
  rect: SVG_ICONS.selectRect,
  ellipse: SVG_ICONS.selectEllipse,
  vline: SVG_ICONS.selectVLine,
  hline: SVG_ICONS.selectHLine,
};
const selectModeLabels = {
  rect: 'Zaznaczenie: prostokat',
  ellipse: 'Zaznaczenie: kolo',
  vline: 'Zaznaczenie: linia pionowa',
  hline: 'Zaznaczenie: linia pozioma',
};
let selectModeIndex = 0;
let selectBtn = null;

// Tools definition
const tools = [
  { id: 'brush',    icon: SVG_ICONS.brush,    label: 'Pedzel' },
  { id: 'select',   icon: SVG_ICONS.selectRect, label: 'Zaznaczenie: prostokat' },
  { id: 'deselect', icon: SVG_ICONS.deselect, label: 'Odznacz' },
  { id: 'bucket',   icon: SVG_ICONS.bucket,   label: 'Wiaderko' },
  { id: 'picker',   icon: SVG_ICONS.picker,   label: 'Próbnik koloru' },
  { id: 'eraser',   icon: SVG_ICONS.eraser,   label: 'Gumka' },
  { id: 'clear',    icon: SVG_ICONS.clearSel, label: 'Wyczysc zaznaczenie' },
  { id: '_sep1' },
  { id: 'newdoc',   icon: SVG_ICONS.newDoc,   label: 'Nowy obrazek' },
];

// --- Init ---
function init() {
  buildToolbar();
  buildPalette();
  buildGrid();
  updateCurrentColor();
}

function buildToolbar() {
  const tb = document.getElementById('toolbar');
  tools.forEach(t => {
    if (t.id.startsWith('_sep')) {
      const sep = document.createElement('div');
      sep.className = 'separator';
      tb.appendChild(sep);
      return;
    }
    const btn = document.createElement('button');
    btn.innerHTML = t.icon + `<span class="tooltip">${t.label}</span>`;
    btn.dataset.tool = t.id;

    if (t.id === 'select') selectBtn = btn;
    if (t.id === currentTool) btn.classList.add('active');

    btn.addEventListener('click', () => {
      // --- Actions (no toggle) ---
      if (t.id === 'clear') {
        clearSelection();
        return;
      }
      if (t.id === 'newdoc') {
        openNewDocModal();
        return;
      }
      if (t.id === 'deselect') {
        if (selection.size > 0) {
          selection.clear();
          renderAll();
        }
        return;
      }

      // --- Select tool: rotate sub-mode on re-click ---
      if (t.id === 'select' && currentTool === 'select') {
        selectModeIndex = (selectModeIndex + 1) % selectModes.length;
        updateSelectBtnVisual();
        return;
      }

      // --- Switch tool ---
      currentTool = t.id;
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    tb.appendChild(btn);
  });
}

function updateSelectBtnVisual() {
  if (!selectBtn) return;
  const mode = selectModes[selectModeIndex];
  const tooltip = selectBtn.querySelector('.tooltip');
  // Replace SVG only (keep tooltip)
  selectBtn.innerHTML = selectModeIcons[mode] + `<span class="tooltip">${selectModeLabels[mode]}</span>`;
}

// --- Color sorting helpers ---
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return [h, s, l];
}

function getSortedPaletteIndices() {
  const entries = PALETTE.map((hex, i) => {
    const [r, g, b] = hexToRgb(hex);
    const [h, s, l] = rgbToHsl(r, g, b);
    return { i, h, s, l };
  });

  // Separate achromatic (very low saturation) from chromatic
  const achromatic = entries.filter(e => e.s < 0.08);
  const chromatic = entries.filter(e => e.s >= 0.08);

  // Sort achromatic by lightness
  achromatic.sort((a, b) => a.l - b.l);

  // Sort chromatic: primary by hue (12 segments), secondary by lightness
  chromatic.sort((a, b) => {
    const hueA = Math.floor(a.h * 12);
    const hueB = Math.floor(b.h * 12);
    if (hueA !== hueB) return hueA - hueB;
    return a.l - b.l;
  });

  // Achromatic first (blacks/grays/whites), then chromatic by hue
  return [...achromatic.map(e => e.i), ...chromatic.map(e => e.i)];
}

function buildPalette() {
  const pal = document.getElementById('palette');
  const sortedIndices = getSortedPaletteIndices();

  sortedIndices.forEach(i => {
    const hex = PALETTE[i];
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' cell-off' : '');
    if (i !== 0) sw.style.backgroundColor = hex;
    sw.innerHTML = `<span class="swatch-tip">${i}: ${hex}</span>`;
    sw.dataset.colorIdx = i;
    if (i === currentColor) sw.classList.add('active');
    sw.addEventListener('click', () => {
      currentColor = i;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      updateCurrentColor();
    });
    pal.appendChild(sw);
  });
}

function buildGrid() {
  const g = document.getElementById('grid');
  for (let i = 0; i < 64; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell cell-off';
    cell.dataset.idx = i;
    cell.innerHTML = `<span class="idx-label">0</span>`;

    cell.addEventListener('mousedown', e => onCellMouseDown(i, e));
    cell.addEventListener('mouseenter', e => onCellMouseEnter(i, e));
    cell.addEventListener('mouseup', e => onCellMouseUp(i, e));
    cell.addEventListener('contextmenu', e => e.preventDefault());

    g.appendChild(cell);
  }

  document.addEventListener('mouseup', () => {
    if (dragState) finishDrag();
    isMouseDown = false;
    selStartCell = null;
  });
}

function updateCurrentColor() {
  const prev = document.getElementById('currentPreview');
  const info = document.getElementById('currentInfo');
  if (currentColor === 0) {
    prev.style.backgroundColor = '';
    prev.className = 'preview cell-off';
  } else {
    prev.className = 'preview';
    prev.style.backgroundColor = PALETTE[currentColor];
  }
  info.innerHTML = `Kolor: ${currentColor}<br>${PALETTE[currentColor]}`;
}

// --- Cell rendering ---
function renderCell(i) {
  const cell = document.getElementById('grid').children[i];
  const v = grid[i];
  if (v === 0) {
    cell.style.backgroundColor = '';
    cell.classList.add('cell-off');
  } else {
    cell.classList.remove('cell-off');
    cell.style.backgroundColor = PALETTE[v];
  }
  cell.querySelector('.idx-label').textContent = v;
  if (selection.has(i)) {
    cell.classList.add('selected');
  } else {
    cell.classList.remove('selected');
  }
}

function renderAll() {
  for (let i = 0; i < 64; i++) renderCell(i);
}

// --- Selection shape helpers ---
function computeSelectionShape(startIdx, endIdx) {
  const mode = selectModes[selectModeIndex];
  const r1 = Math.floor(startIdx / 8), c1 = startIdx % 8;
  const r2 = Math.floor(endIdx / 8), c2 = endIdx % 8;
  const result = new Set();

  if (mode === 'rect') {
    const rMin = Math.min(r1, r2), rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2), cMax = Math.max(c1, c2);
    for (let r = rMin; r <= rMax; r++)
      for (let c = cMin; c <= cMax; c++)
        result.add(r * 8 + c);
  } else if (mode === 'ellipse') {
    const rMin = Math.min(r1, r2), rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2), cMax = Math.max(c1, c2);
    const cx = (cMin + cMax) / 2;
    const cy = (rMin + rMax) / 2;
    const rx = (cMax - cMin) / 2;
    const ry = (rMax - rMin) / 2;
    if (rx === 0 && ry === 0) {
      result.add(r1 * 8 + c1);
    } else {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const dx = (c - cx) / (rx || 0.5);
          const dy = (r - cy) / (ry || 0.5);
          if (dx * dx + dy * dy <= 1.05) {
            result.add(r * 8 + c);
          }
        }
      }
    }
  } else if (mode === 'vline') {
    // Select full column(s) between c1 and c2
    const cMin = Math.min(c1, c2), cMax = Math.max(c1, c2);
    for (let r = 0; r < 8; r++)
      for (let c = cMin; c <= cMax; c++)
        result.add(r * 8 + c);
  } else if (mode === 'hline') {
    // Select full row(s) between r1 and r2
    const rMin = Math.min(r1, r2), rMax = Math.max(r1, r2);
    for (let r = rMin; r <= rMax; r++)
      for (let c = 0; c < 8; c++)
        result.add(r * 8 + c);
  }

  return result;
}

// --- Tool actions ---
function onCellMouseDown(i, e) {
  e.preventDefault();
  isMouseDown = true;

  if (currentTool === 'brush') {
    grid[i] = currentColor;
    renderCell(i);
  } else if (currentTool === 'eraser') {
    grid[i] = 0;
    renderCell(i);
  } else if (currentTool === 'picker') {
    pickColor(grid[i]);
  } else if (currentTool === 'bucket') {
    bucketFill(i);
  } else if (currentTool === 'select') {
    if (selection.has(i)) {
      startDrag(i);
    } else {
      selection.clear();
      selStartCell = i;
      selection.add(i);
      renderAll();
    }
  }
}

function onCellMouseEnter(i, e) {
  if (!isMouseDown) return;

  if (currentTool === 'brush') {
    grid[i] = currentColor;
    renderCell(i);
  } else if (currentTool === 'eraser') {
    grid[i] = 0;
    renderCell(i);
  } else if (currentTool === 'select' && selStartCell !== null && !dragState) {
    selection = computeSelectionShape(selStartCell, i);
    renderAll();
  } else if (dragState) {
    updateDrag(i);
  }
}

function onCellMouseUp(i, e) {
  if (dragState) finishDrag();
}

// --- Bucket fill ---
// --- Color picker ---
function pickColor(colorIdx) {
  currentColor = colorIdx;
  document.querySelectorAll('.swatch').forEach(s => {
    if (parseInt(s.dataset.colorIdx) === colorIdx) {
      s.classList.add('active');
    } else {
      s.classList.remove('active');
    }
  });
  updateCurrentColor();
}

function bucketFill(startIdx) {
  if (selection.size > 0) {
    selection.forEach(i => { grid[i] = currentColor; });
    renderAll();
  } else {
    const targetColor = grid[startIdx];
    if (targetColor === currentColor) return;
    const visited = new Set();
    const stack = [startIdx];
    while (stack.length) {
      const idx = stack.pop();
      if (visited.has(idx)) continue;
      if (grid[idx] !== targetColor) continue;
      visited.add(idx);
      grid[idx] = currentColor;
      const r = Math.floor(idx / 8), c = idx % 8;
      if (r > 0) stack.push((r - 1) * 8 + c);
      if (r < 7) stack.push((r + 1) * 8 + c);
      if (c > 0) stack.push(r * 8 + (c - 1));
      if (c < 7) stack.push(r * 8 + (c + 1));
    }
    renderAll();
  }
}

// --- Selection clear ---
function clearSelection() {
  if (selection.size > 0) {
    selection.forEach(i => { grid[i] = 0; });
    selection.clear();
    renderAll();
  }
}

// --- Drag-move selection ---
function startDrag(anchorCell) {
  const snapshot = {};
  selection.forEach(i => { snapshot[i] = grid[i]; });
  dragState = {
    anchorCell,
    snapshot,
    origPositions: new Set(selection),
  };
  selection.forEach(i => { grid[i] = 0; });
  renderAll();
  drawDragPreview(0, 0);
}

function updateDrag(currentCell) {
  if (!dragState) return;
  const dr = Math.floor(currentCell / 8) - Math.floor(dragState.anchorCell / 8);
  const dc = (currentCell % 8) - (dragState.anchorCell % 8);
  dragState.origPositions.forEach(i => { grid[i] = 0; });
  drawDragPreview(dr, dc);
}

function drawDragPreview(dr, dc) {
  const tempGrid = [...grid];
  const newPositions = new Set();
  for (const [origIdx, color] of Object.entries(dragState.snapshot)) {
    const r = Math.floor(parseInt(origIdx) / 8) + dr;
    const c = (parseInt(origIdx) % 8) + dc;
    if (r >= 0 && r < 8 && c >= 0 && c < 8) {
      const newIdx = r * 8 + c;
      tempGrid[newIdx] = color;
      newPositions.add(newIdx);
    }
  }
  for (let i = 0; i < 64; i++) grid[i] = tempGrid[i];
  selection.clear();
  newPositions.forEach(i => selection.add(i));
  dragState._lastDr = dr;
  dragState._lastDc = dc;
  renderAll();
}

function finishDrag() {
  dragState = null;
  renderAll();
}

// --- New Document ---
function openNewDocModal() {
  document.getElementById('newDocModal').classList.add('visible');
}
function closeNewDocModal() {
  document.getElementById('newDocModal').classList.remove('visible');
}
function confirmNewDoc() {
  for (let i = 0; i < 64; i++) grid[i] = 0;
  selection.clear();
  renderAll();
  closeNewDocModal();
}

// --- File I/O ---
function saveFile() {
  let content = '# Launchpad Mini MK3 pixel art\ndelay 100\n';
  for (let r = 0; r < 8; r++) {
    const row = [];
    for (let c = 0; c < 8; c++) {
      row.push(grid[r * 8 + c]);
    }
    content += row.join(' ') + '\n';
  }
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'launchpad-art.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadFile() {
  document.getElementById('fileInput').click();
}

function handleFileLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const text = ev.target.result;
    const lines = text.split('\n')
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#') && !l.startsWith('delay'));
    let idx = 0;
    for (const line of lines) {
      const nums = line.split(/\s+/).map(Number);
      for (const n of nums) {
        if (idx < 64) {
          grid[idx] = Math.max(0, Math.min(127, n));
          idx++;
        }
      }
    }
    selection.clear();
    renderAll();
  };
  reader.readAsText(file);
  e.target.value = '';
}

// --- Live Preview (Launchpad hardware) ---
let liveEnabled = false;
let livePort = 9321;
let livePending = false;

function toggleLive() {
  liveEnabled = !liveEnabled;
  const btn = document.getElementById('liveBtn');
  btn.classList.toggle('active', liveEnabled);
  btn.classList.remove('error');
  if (liveEnabled) {
    sendGridToLaunchpad();
  }
}

function sendGridToLaunchpad() {
  if (!liveEnabled || livePending) return;
  livePending = true;
  fetch(`http://localhost:${livePort}/grid`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ grid: Array.from(grid) }),
  })
  .then(resp => {
    livePending = false;
    if (!resp.ok) throw new Error(resp.statusText);
    document.getElementById('liveBtn').classList.remove('error');
  })
  .catch(() => {
    livePending = false;
    document.getElementById('liveBtn').classList.add('error');
  });
}

// Hook into renderAll to push changes to Launchpad
const _origRenderAll = renderAll;
renderAll = function() {
  _origRenderAll();
  sendGridToLaunchpad();
};

// --- Start ---
init();
</script>
